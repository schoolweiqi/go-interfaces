<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go Client — автономная основа</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <main>
      <!--
        Левая колонка содержит весь интерфейс управления.
        Правая часть страницы полностью отдана доске, чтобы она могла занимать
        максимум доступной ширины и высоты окна.
      -->
      <aside class="leftPanel">
        <div class="sidebarLogo" aria-label="Школа Го Алексея Нечаева">
          <img src="school-go-logo-site.webp" alt="Школа Го Алексея Нечаева">
        </div>
        <section class="panel modesPanel">
          <h2>Режим отображения</h2>
          <div class="boardModes" aria-label="Режимы отображения доски">
            <button id="boardClean" type="button">чистое поле</button>
            <button id="boardFaces" type="button">лица</button>
            <button id="boardLinks" type="button">связи</button>
            <button id="boardInfluence" type="button">влияние</button>
            <button id="boardPhantom" type="button">фантом</button>
            <button id="boardFog" type="button">туман</button>
          </div>
        </section>

        <section class="panel controls">
          <h2>Партия</h2>

          <div class="gameStateRow">
            <div class="turn">
              <span id="turnStone" class="turnStone"></span>
              <span id="turnText">Ход чёрных</span>
            </div>
            <div class="moveCounter">Ход № <strong id="moveNumber">0</strong></div>
          </div>

          <div class="row gameActions">
            <button id="pass" class="secondary">Пас</button>
            <button id="undo" class="secondary">Отменить ход</button>
          </div>

          <div class="captureInfo">
            Пленные:
            чёрными <strong id="blackCaptures">0</strong> ·
            белыми <strong id="whiteCaptures">0</strong>
          </div>

          <div class="sgfActions">
            <button id="loadSgf" class="secondary" type="button">Загрузить SGF</button>
            <button id="downloadSgf" class="secondary" type="button">Скачать SGF</button>
            <input id="sgfFileInput" type="file" accept=".sgf,application/x-go-sgf,text/plain" hidden>
          </div>

          <div id="gameMsg" class="gameMessage"></div>
        </section>

        <section class="panel ogs">
          <h2>ОГС</h2>
          <div class="msg ogsDisconnected">ОГС не подключен</div>
        </section>

        <section class="panel network">
          <h2>Онлайн-партия</h2>
          <label>
            Размер доски
            <select id="networkSize">
              <option value="19" selected>19 × 19</option>
              <option value="13">13 × 13</option>
              <option value="9">9 × 9</option>
            </select>
          </label>
          <button id="createNetworkGame">Создать онлайн-партию</button>
          <button id="leaveNetworkGame" class="secondary" hidden>Выйти из онлайн-партии</button>
          <div class="networkLinkBox" id="networkLinkBox" hidden>
            <input id="networkGameLink" readonly aria-label="Ссылка на онлайн-партию">
            <button id="copyNetworkLink" class="secondary" type="button">Копировать</button>
          </div>
          <div class="networkStatus" id="networkStatus">Создайте партию и отправьте ссылку второму игроку.</div>
        </section>

        <div hidden aria-hidden="true">
          <button id="login"></button><button id="logout"></button><div id="authMsg"></div>
          <select id="size"><option value="19">19</option><option value="13">13</option><option value="9">9</option></select>
          <select id="speed"><option value="live">Live</option></select>
          <button id="findOpponent"></button><button id="cancelSearch"></button><button id="newGame"></button>
        </div>

        <section class="panel bot">
          <h2>Игра с GNU Go</h2>
          <label>
            Размер доски
            <select id="botSize">
              <option value="19" selected>19 × 19</option>
              <option value="13">13 × 13</option>
              <option value="9">9 × 9</option>
            </select>
          </label>
          <label>
            Сила GNU Go
            <select id="botLevel">
              <option value="0">0 — самая слабая</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10" selected>10 — максимальная</option>
            </select>
          </label>
          <div class="row">
            <label>
              Ваш цвет
              <select id="botColor">
                <option value="1" selected>Чёрные</option>
                <option value="2">Белые</option>
              </select>
            </label>
            <label>
              Коми
              <input id="botKomi" type="number" step="0.5" value="6.5">
            </label>
          </div>
          <button id="startBotGame">Играть с GNU Go</button>
          <button id="stopBotGame" class="secondary" hidden>Завершить игру с ботом</button>
          <div class="botStatusBox" id="botStatus">GNU Go ещё не загружен.</div>
          <div class="botScore" id="botScore" hidden></div>
        </section>

        <section class="panel settings">
          <button id="settingsToggle" class="secondary" type="button" aria-expanded="false">Настройки</button>
          <div id="settingsBody" class="settingsBody" hidden>
            <div class="settingsGroup">
              <h3>Влияние</h3>
              <label>Сила влияния
                <input id="influenceStrength" type="number" min="1" max="20" step="1" value="4">
              </label>
              <label>Коэффициент влияния при 3 дыханиях
                <input id="influenceThreeLibFactor" type="number" min="0" max="1" step="0.05" value="0.8">
              </label>
              <label>Интенсивность
                <input id="influenceIntensity" type="number" min="0" max="255" step="1" value="180">
              </label>
              <label>Radius multiplier
                <input id="influenceRadiusMultiplier" type="number" min="0.1" max="6" step="0.1" value="2">
              </label>
              <label>Gradient falloff
                <input id="influenceGradientFalloff" type="number" min="0.05" max="5" step="0.05" value="0.8">
              </label>
              <label>Stone-point clamp
                <input id="influenceStonePointClamp" type="number" min="0" max="1" step="0.05" value="0.5">
              </label>
              <label class="settingsCheck">
                <input id="influenceNumbers" type="checkbox">
                <span>Число</span>
              </label>
            </div>
          </div>
        </section>
      </aside>

      <section class="boardWrap">
        <div class="boardColumn">
          <canvas id="board" aria-label="Доска Го"></canvas>

          <section class="gameTreeSection" aria-label="Дерево игры">
            <div class="gameTreeHeader">
              <strong>Дерево игры</strong>
              <button id="deleteVariationBranch" class="secondary treeDeleteButton" type="button" disabled>
                Удалить ветку от текущего хода
              </button>
            </div>
            <div id="gameTreeScroller" class="gameTreeScroller">
              <svg id="gameTreeSvg" class="gameTreeSvg" role="img" aria-label="Дерево ходов и вариаций"></svg>
            </div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="game.js"></script>
  <script src="influence.js"></script>
  <script src="faces.js"></script>
  <script src="board.js"></script>
  <script src="ogs.js"></script>
  <script src="ai.js"></script>
  <script src="sgf.js"></script>
  <script src="tree.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
