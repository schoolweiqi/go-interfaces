name: Vendor GNU Go WASM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-gnugo.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download pinned GNU Go browser runtime
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/TristanCacqueray/wasm-gnugo/pages/gnugo.wasm" \
            -o gnugo.wasm
          test -s gnugo.wasm

      - name: Commit runtime binary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gnugo.wasm
          if git diff --cached --quiet; then
            echo "gnugo.wasm is already up to date"
            exit 0
          fi
          git commit -m "Vendor GNU Go WASM runtime"
          git push
